{% extends 'tracker/base.html' %}
{% block title %}Delete Application{% endblock %}
{% block content %}
<h2>Delete "{{ application.job_title }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-accent">Yes, Delete</button>
    <a href="{% url 'application_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
