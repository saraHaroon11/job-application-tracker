{% extends 'tracker/base.html' %}
{% block title %}Edit Interview{% endblock %}
{% block content %}
<h2>Edit Interview — {{ application.job_title }}</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'application_detail' application.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
